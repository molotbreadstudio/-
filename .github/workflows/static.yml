<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title> Converter от Bread Studio Converter </title>
  
  <!-- 🖼 ФАВИКОН (иконка вкладки сайта) -->
  <!-- Положи рядом с html файлом картинку favicon.ico или favicon.png -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f3f4f6; color: #1f2937; padding: 1.5rem; }
    .container { max-width: 560px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #111827; }
    .hint { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.25rem; line-height: 1.5; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
    input[type="file"], select { width: 100%; padding: 10px; margin-bottom: 1.25rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 1.5rem; display: none; }
    .preview-wrapper { border: 2px dashed #d1d5db; padding: 1rem; border-radius: 6px; text-align: center; }
    img#preview { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .download-link { display: inline-block; margin-top: 1rem; padding: 8px 16px; background: #10b981; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
    .status { margin-top: 1rem; padding: 8px 12px; border-radius: 6px; font-size: 0.875rem; display: none; }
    .status.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 📐 ЛОГОТИП: теперь max-width 200px (был 100px) -->
    <img src="logo.png" alt="Bread Studio Logo" style="max-width: 200px; height: auto; margin: 0 auto 1.5rem; display: block;">
    
    <h2>Конвертер изображений</h2>
    <p class="hint">Локально в браузере. Файлы никуда не отправляются.<br>Выход изображений: PNG, JPG, WebP, ICO, SVG.</p>
    
    <label for="fileInput">Выберите файл</label>
    <input type="file" id="fileInput" accept="image/*">
    
    <label for="formatSelect">Целевой формат</label>
    <select id="formatSelect">
      <option value="png">PNG (прозрачность)</option>
      <option value="jpeg">JPG (фото)</option>
      <option value="webp">WebP (веб)</option>
      <option value="ico">ICO (настоящая иконка Windows)</option>
      <option value="svg">SVG (растр внутри SVG)</option>
    </select>
    
    <button onclick="convert()">Конвертировать</button>
    
    <div id="result">
      <div class="preview-wrapper">
        <img id="preview" src="" alt="Результат">
      </div>
      <a id="downloadLink" class="download-link" download>Скачать результат</a>
      <div id="statusMsg" class="status"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const formatSelect = document.getElementById('formatSelect');
    const resultDiv = document.getElementById('result');
    const previewImg = document.getElementById('preview');
    const downloadLink = document.getElementById('downloadLink');
    const statusMsg = document.getElementById('statusMsg');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = 'status ' + type;
      statusMsg.style.display = 'block';
    }

    async function convert() {
      const file = fileInput.files[0];
      if (!file) {
        showStatus('Сначала выберите файл!', 'error');
        return;
      }

      resultDiv.style.display = 'none';
      statusMsg.style.display = 'none';

      try {
        const img = await loadImage(file);
        const targetFormat = formatSelect.value;

        if (targetFormat === 'ico') {
          const blob = await createRealICO(img);
          const url = URL.createObjectURL(blob);
          previewImg.src = url;
          downloadLink.href = url;
          downloadLink.download = 'icon.ico';
        } else if (targetFormat === 'svg') {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/png');
          const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${img.width}" height="${img.height}"><image href="${dataUrl}" width="${img.width}" height="${img.height}"/></svg>`;
          const svgBlob = new Blob([svgString], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(svgBlob);
          previewImg.src = url;
          downloadLink.href = url;
          downloadLink.download = 'image.svg';
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);

          let mimeType = 'image/png';
          let extension = 'png';

          if (targetFormat === 'jpeg') {
            mimeType = 'image/jpeg';
            extension = 'jpg';
          } else if (targetFormat === 'webp') {
            mimeType = 'image/webp';
            extension = 'webp';
          }

          const dataUrl = canvas.toDataURL(mimeType, 0.9);
          const blob = dataURLtoBlob(dataUrl);
          const url = URL.createObjectURL(blob);

          previewImg.src = url;
          downloadLink.href = url;
          downloadLink.download = `image.${extension}`;
        }

        resultDiv.style.display = 'block';
        showStatus(`Готово! Формат: ${formatSelect.options[formatSelect.selectedIndex].text}`, 'success');
      } catch (e) {
        console.error(e);
        showStatus('Ошибка конвертации: ' + e.message, 'error');
      }
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Ошибка чтения файла'));
        reader.readAsDataURL(file);
      });
    }

    // Создаём настоящий ICO с несколькими размерами
    async function createRealICO(img) {
      const sizes = [16, 24, 32, 48, 64, 128, 256];

      const iconData = [];
      let totalSize = 0;

      for (const size of sizes) {
        if (size > Math.max(img.width, img.height)) continue;

        canvas.width = size;
        canvas.height = size;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, size, size);

        const pngDataUrl = canvas.toDataURL('image/png');
        const pngBlob = dataURLtoBlob(pngDataUrl);
        const arrayBuffer = await pngBlob.arrayBuffer();
        const pngBytes = new Uint8Array(arrayBuffer);

        iconData.push({ size, data: pngBytes });
        totalSize += pngBytes.length;
      }

      if (iconData.length === 0) {
        throw new Error('Изображение слишком маленькое для создания ICO');
      }

      const header = new Uint8Array(6);
      header[0] = 0; header[1] = 0;
      header[2] = 1; header[3] = 0;
      header[4] = iconData.length & 0xFF;
      header[5] = (iconData.length >> 8) & 0xFF;

      const dirSize = iconData.length * 16;
      const directory = new Uint8Array(dirSize);

      let offset = header.length + dirSize;

      for (let i = 0; i < iconData.length; i++) {
        const entry = iconData[i];
        const dirOffset = i * 16;

        directory[dirOffset] = entry.size;
        directory[dirOffset + 1] = entry.size;
        directory[dirOffset + 2] = 0;
        directory[dirOffset + 3] = 0;
        directory[dirOffset + 4] = 3;
        directory[dirOffset + 5] = 0;
        directory[dirOffset + 6] = 32;
        directory[dirOffset + 7] = 0;

        const dataLength = entry.data.length;
        directory[dirOffset + 8] = dataLength & 0xFF;
        directory[dirOffset + 9] = (dataLength >> 8) & 0xFF;
        directory[dirOffset + 10] = (dataLength >> 16) & 0xFF;
        directory[dirOffset + 11] = (dataLength >> 24) & 0xFF;

        directory[dirOffset + 12] = offset & 0xFF;
        directory[dirOffset + 13] = (offset >> 8) & 0xFF;
        directory[dirOffset + 14] = (offset >> 16) & 0xFF;
        directory[dirOffset + 15] = (offset >> 24) & 0xFF;

        offset += dataLength;
      }

      const totalLength = header.length + directory.length + iconData.reduce((sum, item) => sum + item.data.length, 0);
      const icoBuffer = new ArrayBuffer(totalLength);
      const icoView = new Uint8Array(icoBuffer);

      icoView.set(header, 0);
      icoView.set(directory, header.length);

      let currentOffset = header.length + directory.length;
      for (const item of iconData) {
        icoView.set(item.data, currentOffset);
        currentOffset += item.data.length;
      }

      return new Blob([icoBuffer], { type: 'image/x-icon' });
    }

    function dataURLtoBlob(dataURL) {
      const parts = dataURL.split(',');
      const type = parts[0].split(';')[0].split(':')[1];
      const byteString = atob(parts[1]);
      const arrayBuffer = new ArrayBuffer(byteString.length);
      const uint8Array = new Uint8Array(arrayBuffer);
      for (let i = 0; i < byteString.length; i++) {
        uint8Array[i] = byteString.charCodeAt(i);
      }
      return new Blob([uint8Array], { type });
    }
  </script>
</body>
</html>
